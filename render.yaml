services:
  # ==============================================================================
  # LegalCompass Unified Web Service (Frontend + Backend on 1 Single Free URL)
  # ==============================================================================
  - type: web
    name: legalcompass
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER_ORDER
        value: groq,gemini,openrouter
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-3.5-flash-lite
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL_ID
        value: nvidia/nemotron-3.5-lightning:free
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
