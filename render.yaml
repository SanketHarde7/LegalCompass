services:
  # ==============================================================================
  # LegalCompass Unified Web Service (Frontend + Backend on 1 Single Free URL)
  # ==============================================================================
  - type: web
    name: legalcompass
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER_ORDER
        value: groq,gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
