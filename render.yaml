services:
  # ---------------------------------------------------------------------------
  # 1. LegalCompass FastAPI Backend
  # ---------------------------------------------------------------------------
  - type: web
    name: legalcompass-backend
    runtime: python
    rootDir: legalcompass-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER_ORDER
        value: groq,gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # ---------------------------------------------------------------------------
  # 2. LegalCompass React Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: legalcompass-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
